[project]
name = "agent-outcome-ledger"
version = "0.1.0"
description = "Join agent spend to outcomes and reallocate on evidence."
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py312"
extend-exclude = [".cache", ".venv", "web/node_modules", "web/dist"]
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
